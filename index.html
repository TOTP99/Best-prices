<body>

    <section class="fan-section" id="chinese-section">

              <div class="deals"></div>
            </div>

          </div>

          <div class="card" data-store-id="guanye">
            <div class="suit-corner top-left"><span>J</span><span>♥</span></div>
            <div class="center-logo">♥</div>
            <div class="content">
              <h3 class="supermarket-name">加载中…</h3>
              <div class="deals"></div>
            </div>
            <div class="suit-corner bottom-right"><span>J</span><span>♥</span></div>
          </div>

          <div class="card" data-store-id="dingtai">
            <div class="suit-corner top-left"><span>Q</span><span>♥</span></div>
            <div class="center-logo">♥</div>
            <div class="content">
              <h3 class="supermarket-name">加载中…</h3>
              <div class="deals"></div>
            </div>
            <div class="suit-corner bottom-right"><span>Q</span><span>♥</span></div>
          </div>

          <div class="card" data-store-id="fuyao">
            <div class="suit-corner top-left"><span>K</span><span>♥</span></div>
            <div class="center-logo">♥</div>
            <div class="content">
              <h3 class="supermarket-name">加载中…</h3>
              <div class="deals"></div>
            </div>
            <div class="suit-corner bottom-right"><span>K</span><span>♥</span></div>
          </div>

          <div class="card" data-store-id="dingxian">
            <div class="suit-corner top-left"><span>A</span><span>♥</span></div>
            <div class="center-logo">♥</div>
            <div class="content">
              <h3 class="supermarket-name">加载中…</h3>
              <div class="deals"></div>
            </div>
            <div class="suit-corner bottom-right"><span>A</span><span>♥</span></div>
          </div>

        </div>
      </div>
    </section>

    <section class="fan-section active-section" id="western-section">
      <div class="fan-wrap">
        <div class="card-deck clubs-theme shuffling" id="western-deck">

          <div class="card" data-store-id="walmart">
            <div class="suit-corner top-left"><span>10</span><span>♣</span></div>

            <div class="content">
              <h3 class="supermarket-name">Loading…</h3>

            </div>
            <div class="suit-corner bottom-right"><span>10</span><span>♣</span></div>
          </div>

          <div class="card" data-store-id="freshco">
            <div class="suit-corner top-left"><span>J</span><span>♣</span></div>
            <div class="center-logo">♣</div>
            <div class="content">
              <h3 class="supermarket-name">Loading…</h3>
              <div class="deals"></div>
            </div>
            <div class="suit-corner bottom-right"><span>J</span><span>♣</span></div>
          </div>

          <div class="card" data-store-id="costco">
            <div class="suit-corner top-left"><span>Q</span><span>♣</span></div>
            <div class="center-logo">♣</div>
            <div class="content">
              <h3 class="supermarket-name">Loading…</h3>
              <div class="deals"></div>
            </div>
            <div class="suit-corner bottom-right"><span>Q</span><span>♣</span></div>
          </div>

          <div class="card" data-store-id="nofrills">
            <div class="suit-corner top-left"><span>K</span><span>♣</span></div>
            <div class="center-logo">♣</div>
            <div class="content">
              <h3 class="supermarket-name">Loading…</h3>
              <div class="deals"></div>
            </div>

          </div>

          <div class="card" data-store-id="foodbasics">
            <div class="suit-corner top-left"><span>A</span><span>♣</span></div>
            <div class="center-logo">♣</div>
            <div class="content">
              <h3 class="supermarket-name">Loading…</h3>
              <div class="deals"></div>
            </div>
            <div class="suit-corner bottom-right"><span>A</span><span>♣</span></div>
          </div>

  </div>

</div>

<div class="analysis-overlay" id="analysisOverlay">
  <div class="analysis-panel" role="dialog" aria-modal="true" aria-label="数据分析">
    <div class="analysis-handle" aria-hidden="true"></div>
    <div class="analysis-header">
      <h2 class="analysis-title">📊 数据分析</h2>
      <button class="analysis-close" id="analysisClose" aria-label="关闭">✕</button>
    </div>
    <div class="analysis-tabs" id="analysisTabs">
      <button class="analysis-tab active" data-tab="bestDeals" type="button">⭐ Best Deals</button>
      <button class="analysis-tab" data-tab="deepestDiscounts" type="button">📉 Discounts</button>
      <button class="analysis-tab" data-tab="categoryWinners" type="button">🏆 Category Winners</button>
      <button class="analysis-tab" data-tab="cheapestStoreSummary" type="button">🏪 Cheapest Stores</button>
    </div>
    <div class="analysis-body" id="analysisBody">
      <p class="analysis-loading">加载中…</p>
    </div>
  </div>
</div>

<script src="deals.js"></script>
<script>
(function () {
  // 日期戳
  const now = new Date();
  document.getElementById('updateStamp').textContent = `${now.getMonth() + 1}/${now.getDate()} 🆕`;

  // 音效
  let audioCtx = null;
  let soundOn = true;

  function ensureCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTick() {
    if (!soundOn) return;
    const ctx = ensureCtx();
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(720, t);
    o.frequency.exponentialRampToValueAtTime(980, t + 0.05);
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(t);
    o.stop(t + 0.1);
  }

  function playShuffle() {
    if (!soundOn) return;
    const ctx = ensureCtx();
    const now = ctx.currentTime;
    [560, 720, 900, 1080].forEach((f, i) => {
      const t = now + i * 0.045;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.08, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t);
      o.stop(t + 0.06);
    });
  }

  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) ensureCtx();
  });

  // 华超 / 西超切换
  const landscapeSwitch = document.getElementById('landscapeSwitch');
  const sections = {
    chinese: document.getElementById('chinese-section'),
    western: document.getElementById('western-section')
  };
  const decks = {
    chinese: document.getElementById('chinese-deck'),
    western: document.getElementById('western-deck')
  };
  let current = 'western';

  function updateLandscapeSwitch() {
    landscapeSwitch.classList.toggle('western-active', current === 'western');
    landscapeSwitch.setAttribute('aria-pressed', current === 'western' ? 'true' : 'false');
  }

  function switchTo(target) {
    if (target === current) return;
    playShuffle();
    const from = current, to = target;
    decks[from].classList.add('shuffling');
    decks[to].classList.add('shuffling');
    setTimeout(() => {
      sections[from].classList.remove('active-section');
      sections[to].classList.add('active-section');
      void decks[to].offsetWidth;
      decks[from].classList.remove('shuffling');
      decks[to].classList.remove('shuffling');
      current = target;
      updateLandscapeSwitch();
    }, 200);
  }

  landscapeSwitch.addEventListener('click', () => {
    switchTo(current === 'chinese' ? 'western' : 'chinese');
  });
  updateLandscapeSwitch();

  window.addEventListener('load', () => {
    setTimeout(() => {
      decks.chinese.classList.remove('shuffling');
      decks.western.classList.remove('shuffling');
    }, 260);
  });

  // 卡片弹出
  const frameEl = document.getElementById('frame');

  function syncFramePoppedState() {
    frameEl.classList.toggle('has-popped', !!document.querySelector('.card.popped'));
  }

  function popCard(card) {
    document.querySelectorAll('.card.popped').forEach(c => {
      if (c !== card) c.classList.remove('popped');
    });
    card.classList.toggle('popped');
    syncFramePoppedState();
    playTick();
  }

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', e => {
      e.stopPropagation();
      popCard(card);
    });
  });

  document.addEventListener('click', () => {
    document.querySelectorAll('.card.popped').forEach(c => c.classList.remove('popped'));
    syncFramePoppedState();
  });

  // 数据分析弹层
  const STORE_NAMES = {
    tnt16: 'T&T 16街',
    guanye: '冠业Kennedy',
    dingtai: '鼎泰Hwy7',
    fuyao: '福耀Hwy7',
    dingxian: '鼎鲜Woodbine',
    walmart: 'Walmart',
    freshco: 'FreshCo',
    costco: 'Costco',
    nofrills: 'No Frills',
    foodbasics: 'Food Basics'
  };

  function storeName(id) { return STORE_NAMES[id] || id; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );
  }

  const trigger = document.getElementById('analysisTrigger');
  const overlay = document.getElementById('analysisOverlay');
  const closeBtn = document.getElementById('analysisClose');
  const tabsWrap = document.getElementById('analysisTabs');
  const body = document.getElementById('analysisBody');
  let analysisData = null;
  let activeTab = 'bestDeals';

  function row(label, text) {
    return `<div class="analysis-row"><span class="analysis-row-store">${esc(label)}</span><span class="analysis-row-text">${esc(text)}</span></div>`;
  }

  function renderBestDeals(data) {
    return Object.entries(data || {}).map(([s, t]) => row(storeName(s), t)).join('');
  }

  function renderDiscounts(list) {
    if (!list || !list.length) return '';
    return list.map(d =>
      `<div class="analysis-row"><span class="analysis-row-store">${esc(storeName(d.store))}</span><span class="analysis-row-text">${esc(d.item)} <b class="analysis-pct">-${d.discountPct}%</b></span></div>`
    ).join('');
  }

  function renderCategoryWinners(data) {
    return Object.entries(data || {}).map(([cat, t]) => row(cat, t)).join('');
  }

  function renderCheapest(data, benchmarks) {
    let html = Object.entries(data || {}).map(([k, t]) => row(k, t)).join('');
    const b = Object.entries(benchmarks || {});
    if (b.length) {
      html += '<div class="analysis-subhead">基准价对比</div>';
      html += b.map(([k, t]) => row(k, t)).join('');
    }
    return html;
  }

  function renderTab() {
    if (!analysisData) return;
    let html = '';
    if (activeTab === 'bestDeals') html = renderBestDeals(analysisData.bestDeals);
    else if (activeTab === 'deepestDiscounts') html = renderDiscounts(analysisData.deepestDiscounts);
    else if (activeTab === 'categoryWinners') html = renderCategoryWinners(analysisData.categoryWinners);
    else if (activeTab === 'cheapestStoreSummary') {
      html = renderCheapest(analysisData.cheapestStoreSummary, analysisData.benchmarksComparison);
    }
    body.innerHTML = html || '<p class="analysis-empty">暂无数据</p>';
  }

  tabsWrap.addEventListener('click', e => {
    const btn = e.target.closest('.analysis-tab');
    if (!btn) return;
    tabsWrap.querySelectorAll('.analysis-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    renderTab();
  });

  function loadAnalysis() {
    body.innerHTML = '<p class="analysis-loading">加载中…</p>';
    fetch('deals-data.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(json => {
        analysisData = json.analysis || {};
        renderTab();
      })
      .catch(() => {
        body.innerHTML = '<p class="analysis-empty">数据加载失败</p>';
      });
  }

  trigger.addEventListener('click', e => {
    e.stopPropagation();
    overlay.classList.add('open');
    if (!analysisData) loadAnalysis();
  });
  closeBtn.addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
})();
</script>
</body>
</html>
