<script src="deals.js"></script>
<script>
  // 更新日期戳
  (function () {
    const now = new Date();
    document.getElementById('updateStamp').textContent = `${now.getMonth() + 1}/${now.getDate()} 🆕`;
  })();

  // 音效
  let audioCtx = null;
  let soundOn = true;

  function ensureCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTick() {
    if (!soundOn) return;
    const ctx = ensureCtx();
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(720, t);
    o.frequency.exponentialRampToValueAtTime(980, t + 0.05);
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.1);
  }

  function playShuffle() {
    if (!soundOn) return;
    const ctx = ensureCtx();
    const now = ctx.currentTime;
    [560, 720, 900, 1080].forEach((f, i) => {
      const t = now + i * 0.045;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.08, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.06);
    });
  }

  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) ensureCtx();
  });

  // 华超/西超切换
  const landscapeSwitch = document.getElementById('landscapeSwitch');
  const sections = { chinese: document.getElementById('chinese-section'), western: document.getElementById('western-section') };
  const decks = { chinese: document.getElementById('chinese-deck'), western: document.getElementById('western-deck') };
  let current = 'western';

  function updateLandscapeSwitch() {
    landscapeSwitch.classList.toggle('western-active', current === 'western');
    landscapeSwitch.setAttribute('aria-pressed', current === 'western' ? 'true' : 'false');
  }

  function switchTo(target) {
    if (target === current) return;
    playShuffle();
    const fromKey = current, toKey = target;
    decks[fromKey].classList.add('shuffling');
    decks[toKey].classList.add('shuffling');
    setTimeout(() => {
      sections[fromKey].classList.remove('active-section');
      sections[toKey].classList.add('active-section');
      void decks[toKey].offsetWidth;
      decks[fromKey].classList.remove('shuffling');
      decks[toKey].classList.remove('shuffling');
      current = target;
      updateLandscapeSwitch();
    }, 200);
  }

  landscapeSwitch.addEventListener('click', () => {
    switchTo(current === 'chinese' ? 'western' : 'chinese');
  });

  updateLandscapeSwitch();

  // 首次发牌动画
  window.addEventListener('load', () => {
    setTimeout(() => {
      decks.chinese.classList.remove('shuffling');
      decks.western.classList.remove('shuffling');
    }, 260);
  });

  // 卡片弹出
  const frameEl = document.getElementById('frame');

  function syncFramePoppedState() {
    frameEl.classList.toggle('has-popped', !!document.querySelector('.card.popped'));
  }

  function popCard(card) {
    document.querySelectorAll('.card.popped').forEach(c => {
      if (c !== card) c.classList.remove('popped');
    });
    card.classList.toggle('popped');
    syncFramePoppedState();
    playTick();
  }

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', e => {
      e.stopPropagation();
      popCard(card);
    });
  });

  document.addEventListener('click', () => {
    document.querySelectorAll('.card.popped').forEach(c => c.classList.remove('popped'));
    syncFramePoppedState();
  });
</script>

<script>
  // ===== 数据分析弹层（独立新增，不改动/依赖上面任何原有逻辑）=====
  (function () {
    const STORE_NAMES = {
      guanye: '冠业 Guanye',
      foodbasics: 'Food Basics',
      nofrills: 'No Frills',
      freshco: 'FreshCo',
      foodymart: '鼎泰 Foodymart',
      tnt16: 'T&T 16街',
      walmart: 'Walmart',
      costco: 'Costco',
      dingtai: '鼎泰',
      fuyao: '福耀',
      dingxian: '鼎鲜'
    };
    function storeName(id) { return STORE_NAMES[id] || id; }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    const trigger = document.getElementById('analysisTrigger');
    const overlay = document.getElementById('analysisOverlay');
    const closeBtn = document.getElementById('analysisClose');
    const tabsWrap = document.getElementById('analysisTabs');
    const body = document.getElementById('analysisBody');

    let analysisData = null;
    let activeTab = 'bestDeals';

    function row(label, text) {
      return `<div class="analysis-row"><span class="analysis-row-store">${esc(label)}</span><span class="analysis-row-text">${esc(text)}</span></div>`;
    }

    function renderBestDeals(data) {
      const entries = Object.entries(data || {});
      if (!entries.length) return '';
      return entries.map(([store, text]) => row(storeName(store), text)).join('');
    }

    function renderDiscounts(list) {
      if (!list || !list.length) return '';
      return list.map(d =>
        `<div class="analysis-row"><span class="analysis-row-store">${esc(storeName(d.store))}</span><span class="analysis-row-text">${esc(d.item)} <b class="analysis-pct">-${d.discountPct}%</b></span></div>`
      ).join('');
    }

    function renderCategoryWinners(data) {
      const entries = Object.entries(data || {});
      if (!entries.length) return '';
      return entries.map(([cat, text]) => row(cat, text)).join('');
    }

    function renderCheapest(data, benchmarks) {
      let html = Object.entries(data || {}).map(([label, text]) => row(label, text)).join('');
      const bEntries = Object.entries(benchmarks || {});
      if (bEntries.length) {
        html += '<div class="analysis-subhead">基准价对比</div>';
        html += bEntries.map(([k, text]) => row(k, text)).join('');
      }
      return html;
    }

    function renderTab() {
      if (!analysisData) return;
      let html = '';
      if (activeTab === 'bestDeals') html = renderBestDeals(analysisData.bestDeals);
      else if (activeTab === 'deepestDiscounts') html = renderDiscounts(analysisData.deepestDiscounts);
      else if (activeTab === 'categoryWinners') html = renderCategoryWinners(analysisData.categoryWinners);
      else if (activeTab === 'cheapestStoreSummary') html = renderCheapest(analysisData.cheapestStoreSummary, analysisData.benchmarksComparison);
      body.innerHTML = html || '<p class="analysis-empty">暂无数据</p>';
    }

    tabsWrap.addEventListener('click', e => {
      const btn = e.target.closest('.analysis-tab');
      if (!btn) return;
      tabsWrap.querySelectorAll('.analysis-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      renderTab();
    });

    function loadData() {
      body.innerHTML = '<p class="analysis-loading">加载中…</p>';
      fetch('deals-data.json', { cache: 'no-store' })
        .then(r => r.json())
        .then(json => {
          analysisData = json.analysis || {};
          renderTab();
        })
        .catch(() => {
          body.innerHTML = '<p class="analysis-empty">数据加载失败</p>';
        });
    }

    function openPanel() {
      overlay.classList.add('open');
      if (!analysisData) loadData();
    }
    function closePanel() {
      overlay.classList.remove('open');
    }

    trigger.addEventListener('click', e => {
      e.stopPropagation();
      openPanel();
    });
    closeBtn.addEventListener('click', closePanel);
    overlay.addEventListener('click', e => {
      if (e.target === overlay) closePanel();
    });
  })();
</script>
