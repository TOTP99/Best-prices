<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1f14">
<title>本周特价 · Weekly Deals</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-suit" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C9 7 4 10 4 14.5 4 17.6 6.4 20 9.5 20c1.5 0 2.9-.6 3.9-1.6L12 22l-1.4-3.6c1-1 2.4-1.6 3.9-1.6 3.1 0 5.5-2.4 5.5-5.5C20 10 15 7 12 2z"/></svg>
    <div class="brand-text"><strong>本周特价</strong><span>Weekly Deals</span></div>
  </div>
  <div class="updated"><span class="updated-label" id="updatedLabel">更新</span><span id="updateStamp">–</span></div>
</header>

<div class="toolbar">
  <div class="segmented" id="groupSwitch" role="tablist" aria-label="切换华超/西超">
    <span class="seg-thumb" aria-hidden="true"></span>
    <button type="button" class="seg-btn on" data-m="store" role="tab" aria-selected="true">商店</button>
    <button type="button" class="seg-btn" data-m="product" role="tab" aria-selected="false">商品</button>
  </div>
  <div class="actions">
    <button type="button" class="icon-btn" id="refreshBtn" aria-label="重新选品">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button type="button" class="icon-btn" id="analysisBtn" aria-label="数据分析">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>
    </button>
    <button type="button" class="icon-btn lang" id="langBtn" aria-label="切换中英文">中</button>
    <button type="button" class="icon-btn" id="soundBtn" aria-label="音效开关">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="waves" d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </div>
</div>

<main class="stage" id="stage">

  <section class="fan on" id="fan-store" aria-label="商店">
    <article class="card" data-store-id="foodbasics" tabindex="0" aria-label="Food Basics">
      <div class="corner tl" aria-hidden="true"><span class="corner-index"><span class="rank">A</span><span class="suit">♠</span></span><span class="store-tag"></span></div>
      <div class="corner br" aria-hidden="true"><span class="rank">A</span><span class="suit">♠</span></div>
      <div class="pip" aria-hidden="true">♠</div>
      <div class="card-body">
        <div class="card-head">
          <span class="flyer-period"></span>
          <span class="deal-count"></span>
        </div>
        <div class="deals"></div>
      </div>
    </article>
    <article class="card" data-store-id="freshco" tabindex="0" aria-label="FreshCo">
      <div class="corner tl" aria-hidden="true"><span class="corner-index"><span class="rank">K</span><span class="suit">♠</span></span><span class="store-tag"></span></div>
      <div class="corner br" aria-hidden="true"><span class="rank">K</span><span class="suit">♠</span></div>
      <div class="pip" aria-hidden="true">♠</div>
      <div class="card-body">
        <div class="card-head">
          <span class="flyer-period"></span>
          <span class="deal-count"></span>
        </div>
        <div class="deals"></div>
      </div>
    </article>
    <article class="card" data-store-id="nofrills" tabindex="0" aria-label="No Frills">
      <div class="corner tl" aria-hidden="true"><span class="corner-index"><span class="rank">Q</span><span class="suit">♠</span></span><span class="store-tag"></span></div>
      <div class="corner br" aria-hidden="true"><span class="rank">Q</span><span class="suit">♠</span></div>
      <div class="pip" aria-hidden="true">♠</div>
      <div class="card-body">
        <div class="card-head">
          <span class="flyer-period"></span>
          <span class="deal-count"></span>
        </div>
        <div class="deals"></div>
      </div>
    </article>
    <article class="card" data-store-id="baifu" tabindex="0" aria-label="百福">
      <div class="corner tl" aria-hidden="true"><span class="corner-index"><span class="rank">J</span><span class="suit">♠</span></span><span class="store-tag"></span></div>
      <div class="corner br" aria-hidden="true"><span class="rank">J</span><span class="suit">♠</span></div>
      <div class="pip" aria-hidden="true">♠</div>
      <div class="card-body">
        <div class="card-head">
          <span class="flyer-period"></span>
          <span class="deal-count"></span>
        </div>
        <div class="deals"></div>
      </div>
    </article>
    <article class="card" data-store-id="guanye" tabindex="0" aria-label="冠业">
      <div class="corner tl" aria-hidden="true"><span class="corner-index"><span class="rank">10</span><span class="suit">♠</span></span><span class="store-tag"></span></div>
      <div class="corner br" aria-hidden="true"><span class="rank">10</span><span class="suit">♠</span></div>
      <div class="pip" aria-hidden="true">♠</div>
      <div class="card-body">
        <div class="card-head">
          <span class="flyer-period"></span>
          <span class="deal-count"></span>
        </div>
        <div class="deals"></div>
      </div>
    </article>
  </section>

  <section class="board" id="productBoard" aria-label="商品">
  </section>
</main>

<!-- 横屏画卷：武士猫 + 樱花花瓣动画（仅横屏显示） -->
<div class="landscape-art" id="landscapeArt" aria-hidden="true">
  <img src="landscape-art.jpg" alt="" draggable="false">
  <canvas id="petalCanvas"></canvas>
</div>

<div class="deals-overlay" id="dealsOverlay">
  <div class="deals-panel" role="dialog" aria-modal="true" aria-labelledby="dealsTitle">
    <div class="analysis-handle" aria-hidden="true"></div>
    <div class="deals-header">
      <div class="deals-title-wrap">
        <span class="deals-suit" id="dealsSuit" aria-hidden="true">♥</span>
        <div class="deals-title-text">
          <h2 class="deals-title" id="dealsTitle">–</h2>
          <div class="deals-meta"><span class="flyer-period" id="dealsPeriod"></span><span class="deals-count" id="dealsCount"></span></div>
        </div>
      </div>
      <button type="button" class="deals-close" id="dealsClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="deals-tools">
      <input class="deals-search" id="dealsSearch" type="search" autocomplete="off" aria-label="搜索商品">
      <div class="deals-sort" id="dealsSort" role="tablist" aria-label="排序">
        <button type="button" class="deals-sort-btn on" data-sort="default" role="tab" aria-selected="true">推荐</button>
        <button type="button" class="deals-sort-btn" data-sort="discount" role="tab" aria-selected="false">折扣</button>
        <button type="button" class="deals-sort-btn" data-sort="price" role="tab" aria-selected="false">价格</button>
      </div>
    </div>
    <div class="deals-list" id="dealsList" role="list"></div>
    <div class="deals-footer">
      <button type="button" class="flyer-btn" id="dealsFlyerBtn">看完整 Flyer</button>
    </div>
  </div>
</div>

<div class="analysis-overlay" id="analysisOverlay">
  <div class="analysis-panel" role="dialog" aria-modal="true" aria-labelledby="analysisTitle">
    <div class="analysis-handle" aria-hidden="true"></div>
    <div class="analysis-header">
      <h2 class="analysis-title" id="analysisTitle">数据分析</h2>
      <button type="button" class="analysis-close" id="analysisClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="analysis-tabs" id="analysisTabs" role="tablist">
      <button type="button" class="analysis-tab active" data-tab="allDeals" role="tab" aria-selected="true">全部</button>
      <button type="button" class="analysis-tab" data-tab="bestDeals" role="tab" aria-selected="false">精选</button>
      <button type="button" class="analysis-tab" data-tab="deepestDiscounts" role="tab" aria-selected="false">折扣</button>
      <button type="button" class="analysis-tab" data-tab="categoryWinners" role="tab" aria-selected="false">品类</button>
      <button type="button" class="analysis-tab" data-tab="cheapestStoreSummary" role="tab" aria-selected="false">最低价</button>
    </div>
    <div class="analysis-body" id="analysisBody">
      <p class="analysis-loading">加载中…</p>
    </div>
  </div>
</div>

<script src="items.js"></script>
<script src="deals.js"></script>
<script src="app.js"></script>
</body>
</html>
