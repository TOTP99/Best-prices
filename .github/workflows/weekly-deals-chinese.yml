name: chinese deals update

on:
  schedule:
    # 每周六 13:51 UTC = 美东夏令时上午 9:51（冬令时上午 8:51）
    # 华超传单周期 周五–周四，周六早上新一周数据已齐
    - cron: '51 13 * * 6'
  # 允许在 Actions 页面手动点 Run workflow 立即跑一次
  workflow_dispatch:

permissions:
  contents: write

# 两个更新任务串行跑, 避免同时 push main 冲突
concurrency:
  group: deals-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: update chinese stores (First Choice 冠业 / Sunfood 百福)
        run: |
          DEALS_DATA_FILE=$GITHUB_WORKSPACE/deals-data.json \
          GLOSSARY_FILE=$GITHUB_WORKSPACE/items.js \
          BACKUP_DIR=$RUNNER_TEMP/deals-backups \
          python3 updater/build.py --only guanye,baifu

      - name: upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deals-run-log-chinese
          path: ${{ runner.temp }}/deals-backups/run-*.log

      - name: commit updated deals-data.json
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add deals-data.json
          git diff --cached --quiet || git commit -m "chinese deals update $(date -u +%F)"
          git pull --rebase origin main || true
          git push
